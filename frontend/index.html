<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuckingTracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- ── Header ── -->
  <header>
    <span class="brand">🥾 RuckingTracker</span>
    <nav id="header-nav" style="display:none">
      <button data-page="dashboard">Dashboard</button>
      <button data-page="activities">Activities</button>
    </nav>
    <button class="btn btn-ghost" id="header-signout" style="display:none">Sign Out</button>
  </header>

  <!-- ── Pages ── -->
  <main>

    <!-- Login -->
    <div id="page-login" class="page">
      <div class="auth-card">
        <h2>Sign In</h2>
        <div id="signin-alert" class="alert"></div>
        <form id="form-signin" novalidate>
          <div class="form-group">
            <label for="signin-email">Email</label>
            <input id="signin-email" type="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input id="signin-password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button class="btn btn-primary btn-full" id="btn-signin" type="submit">Sign In</button>
        </form>
        <p style="margin-top:18px; font-size:0.85rem; color:var(--text-muted)">
          No account? <a href="#" id="link-to-signup">Create one</a>
        </p>
      </div>
    </div>

    <!-- Sign Up -->
    <div id="page-signup" class="page">
      <div class="auth-card">
        <h2>Create Account</h2>
        <div id="signup-alert" class="alert"></div>
        <form id="form-signup" novalidate>
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input id="signup-username" type="text" placeholder="rucker42" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signup-password">Password <small style="color:var(--text-muted)">(min 6 chars)</small></label>
            <input id="signup-password" type="password" placeholder="••••••••" autocomplete="new-password" />
          </div>
          <button class="btn btn-primary btn-full" id="btn-signup" type="submit">Create Account</button>
        </form>
        <p style="margin-top:18px; font-size:0.85rem; color:var(--text-muted)">
          Already have an account? <a href="#" id="link-to-signin">Sign In</a>
        </p>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="page-dashboard" class="page">
      <div id="dashboard-stats"></div>
      <div class="section-header">
        <h3>Recent Activity</h3>
        <button class="btn btn-ghost" onclick="navigate('activities')">View all →</button>
      </div>
      <div id="dashboard-recent" class="activity-list"></div>
    </div>

    <!-- Activities -->
    <div id="page-activities" class="page">
      <div class="section-header">
        <h3>All Rucks</h3>
        <button class="btn btn-primary" id="btn-add-activity">+ Log Ruck</button>
      </div>
      <div id="activity-list" class="activity-list"></div>
    </div>

  </main>
</div>

<!-- ── Add/Edit Activity Modal ── -->
<div id="activity-modal" class="modal-backdrop">
  <div class="modal">
    <h3 id="modal-title">Log New Ruck</h3>
    <div id="activity-alert" class="alert"></div>
    <form id="form-activity" novalidate>
      <div class="form-group">
        <label for="act-title">Title *</label>
        <input id="act-title" type="text" placeholder="Morning Ruck" />
      </div>
      <div class="form-group">
        <label for="act-started-at">Date &amp; Time *</label>
        <input id="act-started-at" type="datetime-local" />
      </div>
      <div class="form-group">
        <label for="act-distance">Distance (miles)</label>
        <input id="act-distance" type="number" step="0.01" min="0" placeholder="4.5" />
      </div>
      <div class="form-group">
        <label for="act-duration">Duration (minutes)</label>
        <input id="act-duration" type="number" step="1" min="0" placeholder="60" />
      </div>
      <div class="form-group">
        <label for="act-pack-weight">Pack Weight (lbs)</label>
        <input id="act-pack-weight" type="number" step="0.5" min="0" placeholder="35" />
      </div>
      <div class="form-group">
        <label for="act-notes">Notes</label>
        <textarea id="act-notes" placeholder="Hill repeats, great sunrise…"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btn-modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-modal-save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Delete Confirm Modal ── -->
<div id="delete-modal" class="modal-backdrop">
  <div class="modal" style="max-width:360px">
    <h3>Delete Ruck</h3>
    <p style="color:var(--text-muted); font-size:0.92rem; margin-bottom:16px">
      Are you sure you want to delete <strong id="delete-confirm-name"></strong>? This cannot be undone.
    </p>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-delete-cancel">Cancel</button>
      <button class="btn btn-danger" id="btn-delete-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
