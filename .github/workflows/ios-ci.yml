name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: iOS quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project RuckingTracker/RuckingTracker.xcodeproj \
            -scheme RuckingTracker \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest" \
            | tee xcodebuild-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          if-no-files-found: ignore
