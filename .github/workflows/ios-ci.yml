name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: iOS quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
      - name: Select an available iOS Simulator
        id: simulator
        run: |
          SIMULATOR_NAME="$(xcrun simctl list devices available \
            | grep "iPhone" \
            | head -n 1 \
            | awk -F' \(' '{print $1}' \
            | tr -d '\r')"

          if [ -z "$SIMULATOR_NAME" ]; then
            echo "No available iPhone simulator found." >&2
            exit 1
          fi

          echo "name=$SIMULATOR_NAME" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project RuckingTracker/RuckingTracker.xcodeproj \
            -scheme RuckingTracker \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            | tee xcodebuild-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          if-no-files-found: ignore
