name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: iOS quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
      - name: Select a compatible iOS Simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          destinations = subprocess.check_output(
              [
                  "xcodebuild",
                  "-showdestinations",
                  "-project",
                  "RuckingTracker/RuckingTracker.xcodeproj",
                  "-scheme",
                  "RuckingTracker",
              ],
              text=True,
          )

          matches = re.findall(
              r"\{ platform:iOS Simulator, arch:[^,]+, id:([^,]+), OS:([^,]+), name:([^}]+) \}",
              destinations,
          )

          selected = next(
              ((udid.strip(), os_version.strip(), name.strip()) for udid, os_version, name in matches if name.strip().startswith("iPhone")),
              None,
          )

          if selected is None and matches:
              udid, os_version, name = matches[0]
              selected = (udid.strip(), os_version.strip(), name.strip())

          if selected is None:
              raise SystemExit("No concrete iOS Simulator destinations found for scheme RuckingTracker")

          udid, os_version, name = selected
          print(f"Using simulator: {name} (iOS {os_version}) [{udid}]")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
              github_output.write(f"id={udid}\n")
          PY
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project RuckingTracker/RuckingTracker.xcodeproj \
            -scheme RuckingTracker \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            | tee xcodebuild-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          if-no-files-found: ignore
