name: iOS Release Archive

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  archive:
    name: Archive iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RuckingTracker/RuckingTracker.xcodeproj \
            -scheme RuckingTracker \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/RuckingTracker.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-archive.log
      - name: Package archive
        if: success()
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/RuckingTracker.xcarchive" RuckingTracker.xcarchive.zip
      - name: Upload archive and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RuckingTracker-${{ github.ref_name }}
          path: |
            RuckingTracker.xcarchive.zip
            xcodebuild-archive.log
          if-no-files-found: ignore
